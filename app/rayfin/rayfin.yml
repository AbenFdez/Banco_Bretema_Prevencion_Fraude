id: consola-alertas-bretema
name: consola-alertas-bretema
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
  # Decisiones de las analistas (entidad RevisionAlerta) en la SQL database de la app.
  data:
    enabled: true
    path: packages/data
    buildCommand: npm run build
    dialect: "mssql"
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false

# Lectura del Lakehouse Bretema_LH a través de su punto de conexión SQL de análisis.
# Los identificadores se leen de rayfin/.env (copia rayfin/.env.example y rellénalo).
# La app lee con su propia identidad (la de quien la despliega), así que esa
# persona necesita acceso de lectura al Lakehouse.
connectors:
  - name: bretema
    type: fabric-sqlanalytics
    config:
      workspaceId: ${BRETEMA_WORKSPACE_ID}
      itemId: ${BRETEMA_LAKEHOUSE_ID}
    auth:
      type: application
    operations:
      - name: read
